name: factory-netdata

services:
  netdata:
    image: netdata/netdata@sha256:c7eab00e20901eb60595ebae0fbfe88e59464e663924461874719d40de0735d2
    container_name: netdata
    hostname: ${NETDATA_HOSTNAME:-homelab}
    restart: unless-stopped
    pid: host
    network_mode: host
    cgroup: host
    mem_limit: 512m
    cpus: 0.5
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    command: ["-i", "${NETDATA_LISTEN:-127.0.0.1:19999}"]
    environment:
      DISABLE_TELEMETRY: "1"
    volumes:
      - config:/etc/netdata
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      - ./dashboard:/usr/share/netdata/web/factory:ro
      - data:/var/lib/netdata
      - cache:/var/cache/netdata
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

volumes:
  config:
  data:
  cache:
