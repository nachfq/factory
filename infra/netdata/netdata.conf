[db]
    db = dbengine
    update every = 5
    storage tiers = 1
    dbengine tier 0 retention size = 256MiB
    dbengine tier 0 retention time = 1d

[ml]
    enabled = no

[health]
    enabled = no

[statsd]
    enabled = yes
    bind to = udp:127.0.0.1:8125
    update every (flushInterval) = 5s
    create private charts for metrics matching = factory.incus.*.used factory.collector.failures
    max private charts hard limit = 200
    set charts as obsolete after = 1200
    add dimension for number of events received = no

[plugins]
    factory-memory = yes
    ebpf = no
    systemd-journal = no
    systemd-units = no

[plugin:factory-memory]
    update every = 10
