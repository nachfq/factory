# Root filesystem capacity; instance gauges are private charts so they can
# expire individually after deletion or failed measurements.
[app]
    name = statsd_factory
    metrics = factory.host.*
    private charts = no
    gaps when not collected = no

[host_disk_space]
    name = host_disk_space
    title = Host root filesystem space
    family = host_storage
    context = statsd_factory.host_disk_space
    units = GiB
    priority = 100
    type = stacked
    # Values arrive in GiB. Large byte divisors can overflow StatsD's internal
    # integer divisor when multiplied by its decimal detail (1000).
    dimension = factory.host.root.used used last 1 1
    dimension = factory.host.root.available available last 1 1
    dimension = factory.host.root.reserved reserved last 1 1
