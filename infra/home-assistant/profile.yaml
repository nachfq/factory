description: Home Assistant service; unprivileged Incus guest with nested Docker
config:
  boot.autostart: "true"
  boot.host_shutdown_timeout: "90"
  limits.cpu: "2"
  limits.memory: 2GiB
  limits.memory.swap: 1GiB
  security.idmap.isolated: "true"
  security.privileged: "false"
  security.nesting: "true"
  security.syscalls.intercept.mknod: "true"
  security.syscalls.intercept.setxattr: "true"
devices:
  eth0:
    name: eth0
    network: home-lan
    type: nic
  root:
    path: /
    pool: pilot
    type: disk
  web:
    type: proxy
    listen: tcp:127.0.0.1:8123
    connect: tcp:127.0.0.1:8123
