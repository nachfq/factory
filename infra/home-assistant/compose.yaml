name: home-assistant
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    stop_grace_period: 60s
    # This is the Incus guest's network/device namespace, not the physical host's.
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
